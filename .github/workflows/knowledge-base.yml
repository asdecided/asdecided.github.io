name: Knowledge base

# GitHub Pages is a transitional mirror; https://asdecided.com/docs/ is canonical.

on:
  pull_request:
    paths:
      - ".github/workflows/knowledge-base.yml"
      - "knowledge/**"
      - "mkdocs.yml"
      - "scripts/vendor-knowledge.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/knowledge-base.yml"
      - "knowledge/**"
      - "mkdocs.yml"
      - "scripts/vendor-knowledge.sh"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs
        run: pip install mkdocs==1.6.1 mkdocs-material==9.7.6
      - name: Vendor authoritative knowledge
        run: ./scripts/vendor-knowledge.sh
      - name: Build knowledge base
        run: mkdocs build --strict
      - name: Verify canonical documentation origin
        run: |
          test "$(grep -RIl 'rel=\"canonical\" href=\"https://asdecided.com/docs/' site --include='*.html' | wc -l)" -gt 0
          ! grep -RIl 'rel=\"canonical\" href=\"https://docs.asdecided.com/' site --include='*.html'
          grep -q 'https://asdecided.com/docs/' site/sitemap.xml
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
